[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "belgium-abm"
version = "0.2.0"
description = "Belgian lifecycle agent-based model of income and wealth inequality: real-data synthetic population, lifecycle dynamics, tax-benefit scenarios."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Parquet output is written when pyarrow is importable; CSV is always written and is the
# canonical (hash-checked) format.
parquet = ["pyarrow>=16"]

[project.scripts]
abm = "belgium_abm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/belgium_abm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E501", "SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "yaml.*"]
ignore_missing_imports = true
