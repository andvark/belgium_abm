# Dataset registry / provenance manifest (spec section 8).
#
# EVERY entry is currently `not_acquired`: no real Belgian dataset has been loaded into this
# project. Set `file_path`, `reference_year` and `status: acquired` only when a real file is
# genuinely in place. URLs are the ones named in the specification; entries without a URL in
# the specification are left null rather than guessed.
# `license_or_terms: verify` means the terms have NOT been checked yet.

- id: statbel_population
  producer: Statbel
  url: https://statbel.fgov.be/en/open-data
  reference_year: null
  geography: Belgium
  unit: persons
  dimensions:
  - age
  - sex
  - municipality
  - nationality
  access: open
  file_path: null
  license_or_terms: verify
  variables_used: []
  method_notes: Public aggregate counts of population by age/sex/place. Feeds the population targets table.
  model_input: population (age x sex x region)
  needed_for_phase: 1
  restricted_microdata: false
  status: not_acquired
