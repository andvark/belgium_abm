# BASELINE configuration on REAL Belgian aggregate data (reference year 2025).
#
# Tables in data/real/belgium_2025/ are built by `abm fetch-data --year 2025` from Eurostat's
# open API (national statistics supplied by Statbel / the Belgian LFS) and Statbel's BeStat API.
# Each table's header states whether it is `observed` or `derived`; every assumption behind
# the derived tables is listed in data/real/belgium_2025/build_manifest.json and docs/data_real.md.
# The parameters below are modelling CONVENTIONS (status `assumed`), not Belgian statistics.
name: belgium_baseline
baseline_year: 2025
allow_synthetic_demo_data: false
regions: [BE_BRUSSELS, BE_FLANDERS, BE_WALLONIA]
sources_registry: data/sources.yaml
output_dir: outputs/belgium_baseline
inputs:
  population: data/real/belgium_2025/population_age_sex_region.csv
  households: data/real/belgium_2025/household_templates_region.csv
  education: data/real/belgium_2025/education_by_age_region.csv
  labour_state: data/real/belgium_2025/labour_state_by_age_education_region.csv
  work_arrangement: data/real/belgium_2025/work_arrangement_by_age_region.csv
  tenure: data/real/belgium_2025/tenure_by_household_type_region.csv
generator:
  n_persons: 100000
  pool_multiplier: 10.0
  min_pool_per_template: 200
  max_candidate_attempts: 50
  ipu_max_iterations: 500
  ipu_tolerance: 1.0e-4
  refine_swaps_per_household: 40
  refine_counts_proposals_per_cell: 300
  population_household_consistency_tol: 0.01
tolerance:
  marginal_rel_warn: 0.01
  marginal_rel_fail: 0.05
  cell_rel_warn: 0.10
  cell_rel_fail: 0.25
  cells_can_fail: false
  min_expected_count: 20
  small_cell_abs_tol: 3
  rounding_slack_units: 2
  min_group_size: 30
parameters:
  # The values below are modelling CONVENTIONS to be confirmed, not Belgian statistics.
  adult_age:
    {value: 18, status: assumed, source: "convention (legal age of majority)", unit: years, definition: "Age at or above which a person is an adult in household construction."}
  working_age_min:
    {value: 15, status: assumed, source: "convention aligned with the LFS lower age limit", unit: years, definition: "Lowest age for which education / labour state / arrangement are assigned."}
  min_parent_age_at_birth:
    {value: 16, status: assumed, source: "placeholder rule for candidate generation - to be replaced by an empirically justified bound", unit: years, definition: "Minimum parent-minus-child age accepted when linking children to parents."}
  max_parent_age_at_birth:
    {value: 50, status: assumed, source: "placeholder rule for candidate generation - to be replaced by an empirically justified bound", unit: years, definition: "Maximum parent-minus-child age accepted when linking children to parents."}
  couple_age_difference_sd:
    {value: 3.0, status: assumed, source: "placeholder proposal width; IPU re-weights candidates, so it is not an estimate of Belgian couple age gaps", unit: years, definition: "SD of partner-minus-head age difference used only to propose candidate couples."}
  within_band_age_distribution:
    {value: uniform, status: assumed, source: "modelling convention", unit: none, definition: "Single-year age distribution inside a published age band."}
  equivalence_first_adult_weight:
    {value: 1.0, status: assumed, source: "project specification section 5 (modified OECD scale); convention, not an estimate", unit: weight, definition: "Equivalence scale weight of the first adult."}
  equivalence_additional_person_weight:
    {value: 0.5, status: assumed, source: "project specification section 5 (modified OECD scale); convention, not an estimate", unit: weight, definition: "Weight of each additional person aged at/above the child-age threshold."}
  equivalence_child_weight:
    {value: 0.3, status: assumed, source: "project specification section 5 (modified OECD scale); convention, not an estimate", unit: weight, definition: "Weight of each child below the child-age threshold."}
  equivalence_child_age_threshold:
    {value: 14, status: assumed, source: "project specification section 5 (modified OECD scale); convention, not an estimate", unit: years, definition: "Age below which a household member counts as a child in the equivalence scale."}
